id = "hamweard"
name = "Hamweard"
version = "1.3.0"         # release-please sets it in each release pull request
authors = ["VulonLok (EU4 Menu Patch)", "Happy Dwarf Team (Anvil port)"]
description = "Back on the country selection screen and Exit to Menu in a campaign return to the main menu without restarting the game. A port of EU4 Menu Patch by VulonLok (MIT)."
api = 2
anvil = ">=1.9.0"
entry = "hamweard.dll"
phase = "main"
symbols = "symbols.toml"   # the game build comes from here
# A return does not change the simulation: a new campaign after it matches one from a
# fresh process with the same seed (lab: docs/hamweard-ironman-default.md). So Anvil does
# not suspend the plugin, and multiplayer stays out by the plugin's own check: any session
# ends with the game's restart, as without the plugin.
affects_gameplay = false
issues = "https://github.com/happy-dwarf-team/hamweard/issues"
repository = "https://github.com/happy-dwarf-team/hamweard"
