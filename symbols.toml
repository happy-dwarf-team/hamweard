# Every game address the plugin uses, for EU4 1.37.5 on Steam and the GOG
# builds 1.37.5.2 and 1.37.5.0 (win64). Anvil verifies them against eu4.exe before loading
# the DLL and skips the plugin on any other build. The GOG builds have no Steam
# lobby: its four symbols are absent there (Anvil 1.9), and the GOG addresses
# come from the lab's port (its eu4.pdb names them; hamweard#9). After a change, run the hamweard-check target with EU4_EXE
# set and commit symbols.lock.
#
# The sites, functions and structure offsets come from EU4 Menu Patch
# (https://github.com/YozoraTempest/EU4-Menu-Patch, MIT, (c) 2026 VulonLok),
# v0.1.4 at 7752efd; the bytes were read from the Steam eu4.exe 1.37.5
# (SHA-256 9AD3EFE1...D771A).
