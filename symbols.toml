# Every game address the plugin uses, for EU4 1.37.5 (Steam, win64). Anvil
# verifies them against eu4.exe before loading the DLL and skips the plugin on
# any other build. After a change, run the menu_patch-check target with EU4_EXE
# set and commit symbols.lock.
#
# The sites, functions and structure offsets come from EU4 Menu Patch
# (https://github.com/YozoraTempest/EU4-Menu-Patch, MIT, (c) 2026 VulonLok),
# v0.1.4 at 7752efd; the bytes were read from the Steam eu4.exe 1.37.5
# (SHA-256 9AD3EFE1...D771A).
build = "eu4-1.37.5-steam-win64"

# --- the two blocks the plugin replaces ---

[symbol.in_game_menu_block]
rva = 0x815CAE
bytes = "48 8D 8D 40 02 00 00"         # lea rcx, [rbp+0x240]
memory = "code"
resume = "in_game_idle_epilogue"
note = "CInGameIdler::Idle (r13 = the idler): the Exit to Menu branch, which sets the exit and restart flags"

[symbol.in_game_idle_epilogue]
rva = 0x8165F2
bytes = "49 8B 85 30 03 00 00 48 8B 88 70 03 00 00 0F B6 85 48 02 00 00"
memory = "code"
note = "CInGameIdler::Idle: the stock epilogue the Exit to Menu branch resumes at"

[symbol.pregame_menu_block]
rva = 0x111DFD7
bytes = "66 C7 83 83 00 00 00 01 01"   # mov word [rbx+0x83], 0x0101
memory = "code"
resume = "pregame_menu_continuation"
note = "country selection Back (rbx = the application): sets exit + restart (app+0x83/0x84)"

[symbol.pregame_menu_continuation]
rva = 0x111E000
bytes = "48 8B 5D B0 48 85 DB 74 5C"   # mov rbx, [rbp-0x50]; test rbx, rbx; je
memory = "code"
note = "where country selection Back goes on after the flags"

# --- the frontend idler's tick ---

[symbol.frontend_tick_slot]
rva = 0x1D5A8E8
memory = "read"
points_to = 0x10D2E80
note = "slot +0x20 of the frontend idler vtable 0x1D5A8C8: void tick(idler, bool update)"

# --- vtables the plugin compares against ---

[symbol.steam_lobby_vtable]
rva = 0x1DA6D38
memory = "read"
points_to = 0x1658A80
note = "CSteamLobby's vtable; slot 0 checked so the lobby pointer is known to be one"

[symbol.minimap_vtable]
rva = 0x1D6C620
memory = "read"
points_to = 0x1248740
note = "the in-game minimap controller's vtable; slot 0 is its deleting destructor"

# --- game functions ---

[symbol.busy_enter]
rva = 0x470AF0
bytes = "40 53 48 83 EC 20 48 8B D9"
memory = "code"
signature = "void* (void* previous)"
note = "busy scope: saves the previous state in *previous"

[symbol.busy_leave]
rva = 0x470B30
bytes = "40 53 48 83 EC 20 48 8B D9"
memory = "code"
signature = "void (void* previous)"
note = "busy scope: restores the state busy_enter saved"

[symbol.lobby_close]
rva = 0x1658D50
bytes = "40 53 48 83 EC 20 80 B9 99 02 00 00 00"   # cmp byte [rcx+0x299], 0 (hosting)
memory = "code"
signature = "void (void* lobby)"
note = "CSteamLobby: stops hosting, leaves the lobby, unregisters the lobby event context"

[symbol.lobby_disconnect]
rva = 0x165B0C0
bytes = "40 53 48 83 EC 20 48 8B D9 8B 89 C4 01 00 00"
memory = "code"
signature = "void (void* lobby)"
note = "CSteamLobby: clears the outstanding join result"

[symbol.lobby_initialize]
rva = 0x1658CB0
bytes = "40 53 48 83 EC 20 48 8B D9"
memory = "code"
signature = "void (void* lobby)"
note = "CSteamLobby: registers the lobby event context again"

[symbol.in_game_exit]
rva = 0x80FEE0
bytes = "40 53 48 83 EC 30 48 8B D9"
memory = "code"
signature = "void (void* idler)"
note = "CInGameIdler: the stock exit of the campaign view"

[symbol.campaign_exit_cleanup]
rva = 0x5CC160
bytes = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 55 48 8B EC"
memory = "code"
signature = "void ()"
note = "called by EU4 Menu Patch after in_game_exit; not analysed further"

[symbol.notifications_destroy]
rva = 0xDFFCF0
bytes = "48 89 5C 24 08 48 89 6C 24 10 48 89 74 24 18 48 89 7C 24 20 41 56"
memory = "code"
signature = "void (void* notices)"
note = "the diplomatic notifications' full destructor (GUI and callbacks), as the in-game reload uses it"

[symbol.minimap_destroy]
rva = 0x1248740
bytes = "48 89 5C 24 08 48 89 74 24 10 57 48 83 EC 20 8B FA 48 8B F1"
memory = "code"
signature = "void (void* controller, uint32_t flags)"
note = "the minimap controller's deleting destructor (flags 1 frees it)"

[symbol.continue_record_read]
rva = 0x5D1670
bytes = "48 89 5C 24 08 48 89 74 24 10 48 89 7C 24 18 55 41 54 41 55 41 56 41 57"
memory = "code"
signature = "void (void* record)"
note = "reads the Continue game record (4 strings and a valid flag at +0x80)"

[symbol.set_save_metadata]
rva = 0x2110C0
bytes = "48 89 5C 24 08 57 48 83 EC 20 48 8B D9 48 8B FA"
memory = "code"
signature = "void (void* app, const void* path)"
note = "joins the previous metadata job and replaces the app's cached save information"

[symbol.string_free]
rva = 0x95660
bytes = "40 53 48 83 EC 20 48 8B 51 18 48 8B D9"
memory = "code"
signature = "void (void* string)"
note = "frees an MSVC std::string's heap buffer"

[symbol.game_alloc]
rva = 0x1A332D4
bytes = "40 53 48 83 EC 20 48 8B D9"
memory = "code"
signature = "void* (uint64_t size)"
note = "the game's operator new"

[symbol.main_menu_construct]
rva = 0x10D23C0
bytes = "48 8B C4 48 89 58 10 48 89 70 18 48 89 78 20 48 89 48 08 55"
memory = "code"
signature = "void* (void* memory, void* app_350, void* app_358, void* app)"
note = "the main menu idler's constructor (0xB48 bytes)"

[symbol.set_next_idler]
rva = 0x14C2530
bytes = "48 89 5C 24 08 48 89 74 24 10 57 48 83 EC 20 48 8B DA"
memory = "code"
signature = "void (void* app, void** idler, bool flag)"
note = "takes the idler (nulls *idler) into app+0x70; the switch happens on a later frame"

[symbol.reset_game]
rva = 0x210000
bytes = "48 89 5C 24 08 55 56 57 41 54 41 55 41 56 41 57"
memory = "code"
signature = "void (void* app, bool flag)"
note = "ResetGame: replaces the world; turns any non-zero multiplayer restriction into 1"

[symbol.history_post_validate]
rva = 0x7E9B70
bytes = "48 89 5C 24 10 48 89 6C 24 18 48 89 74 24 20 57"
memory = "code"
signature = "void (void* history)"
note = "the history's post-load validation, which ResetGame runs on its own only for an in-game idler"

# --- sprite textures (the crash in the next campaign) ---

[symbol.sprite_draw]
rva = 0x156BFB0
bytes = "48 8B C4 48 89 58 08 48 89 70 10 48 89 78 18 4C 89 60 20 55 41 56 41 57"
memory = "code"
note = "draws a sprite type (rcx); a lazy one without its texture logs 'Should not be lazy loaded' and draws the stale handle at +0x1D8"

[symbol.sprite_load_texture]
rva = 0x156E0A0
bytes = "48 89 5C 24 10 48 89 74 24 18 48 89 7C 24 20 55 41 54 41 55 41 56 41 57"
memory = "code"
signature = "void (void* sprite)"
note = "loads a sprite type's texture: id at +0x258, handle at +0x1D8"

[symbol.icon_show]
rva = 0x15BD460
# ...; mov rdi, [rbx+0x1B8]; mov eax, [rdi+0x288]; test eax, eax
bytes = "40 53 48 83 EC 20 48 8B 01 48 8B D9 FF 50 70 84 C0 75 75 48 89 7C 24 38 48 8B BB B8 01 00 00 8B 87 88 02 00 00 85 C0"
memory = "code"
values.shown_count = { at = 33, size = 4 }
note = "an icon is shown: the sprite type's shown count goes up, and a lazy texture is loaded only when it was 0"

# --- data ---

[symbol.world]
rva = 0x233FE78
memory = "write"
type = "uintptr_t"
note = "the game root object; its multiplayer restriction reason is the uint32 at +0x23B4"

[symbol.history]
rva = 0x233FEA0
memory = "write"
type = "uintptr_t"
note = "the history object history_post_validate takes"
